  <body>
    <h1>Configuring nginx as a reverse proxy</h1>
    <pre><code>server {
  listen 80;
  location / {
    proxy_pass http://localhost:3000;
    proxy_set_header Host $host;
  }
}</code></pre>
    <p>
      Reload nginx with <code>sudo nginx -s reload</code> after editing the
      config.
    </p>
